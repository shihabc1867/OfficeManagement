<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office Management</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f5f4;--cd:#fff;--tx:#17211f;--mu:#667471;--pr:#0f766e;--bd:#d9e1df;--ok:#16a34a;--no:#dc2626;--wn:#d97706}
[data-theme=dark]{--bg:#0d1514;--cd:#152120;--tx:#e6efed;--mu:#8fa3a0;--bd:#25393a;--pr:#2dd4bf}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:22px;text-align:center;margin:12px 0 4px}h2{font-size:17px;margin:4px 0 8px}
.bar{display:flex;gap:8px;justify-content:flex-end}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0}
input,select,textarea{width:100%;padding:10px;margin-top:4px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:140px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
[data-theme=dark] .btn{color:#06201d}
.btn.s{padding:6px 10px;font-size:13px}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--no);color:#fff}
form>.btn{width:100%;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.mu{color:var(--mu);font-size:13px}.c{text-align:center}
.err{color:var(--no);min-height:18px;text-align:center;margin:6px 0 0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.tabs .btn{white-space:nowrap}
.wa{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 3px 10px #0005;cursor:pointer}
.terms{position:fixed;left:14px;bottom:20px;font-size:13px;color:var(--tx);text-decoration:underline;font-weight:600}
.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:16px;z-index:5}
.modal .card{max-height:82vh;overflow:auto;width:100%;max-width:520px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse}td,th{padding:7px 4px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}
.btn.g.p.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.g.l.on{background:var(--wn);color:#fff;border-color:var(--wn)}
.btn.g.a.on{background:var(--no);color:#fff;border-color:var(--no)}
.key{font:700 18px ui-monospace,monospace;letter-spacing:1px;word-break:break-all}
a{color:var(--pr)}
</style></head>
<body><div id="app"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbyT3HWoEZIJG1881496n6NI_gtXExUSAb7rsFtdLhRO_DkNkgF1GZ2FVf0x8Olvb1pb/exec';

/* Bengali translations (UI is English by default) */
const BN={'Office Management':'অফিস ম্যানেজমেন্ট','Secret key':'সিক্রেট কি','Your name':'আপনার নাম','Mobile':'মোবাইল','Institution name':'প্রতিষ্ঠানের নাম','Institution address':'প্রতিষ্ঠানের ঠিকানা','Category':'ক্যাটাগরি','Continue':'এগিয়ে যান','Secret key not working? Contact admin':'সিক্রেট কি কাজ করছে না? এডমিনের সাথে যোগাযোগ করুন','Terms & Conditions':'নীতিমালা ও শর্ত','Do you agree?':'আপনি কি একমত?','Yes':'হ্যাঁ','No':'না','Logout':'লগ আউট','Close':'বন্ধ করুন','Students':'স্টুডেন্ট','Teachers':'টিচার','Student':'স্টুডেন্ট','Teacher':'টিচার','Employee':'কর্মচারী','Attendance':'এটেন্ডেন্স','Reports':'রিপোর্ট','Notifications':'নোটিফিকেশন','Employees':'কর্মচারী','Salary':'বেতন হিসাব','Attendance Summary':'উপস্থিতি হিসাব','Daily Attendance':'হাজিরা','Team':'সহযোগী','Name':'নাম','Class':'ক্লাস','Subject':'বিষয়','Designation':'পদবি','Base salary':'মূল বেতন','Add':'যোগ করুন','Delete':'মুছুন','Present':'উপস্থিত','Late':'দেরি','Absent':'অনুপস্থিত','Weekly':'সাপ্তাহিক','Monthly':'মাসিক','Paid':'পরিশোধিত','Title':'শিরোনাম','Message':'বার্তা','Save':'সংরক্ষণ','Enable':'চালু করুন','Disable':'বন্ধ করুন','Approve':'অনুমোদন','Reject':'বাতিল','Date':'তারিখ','Month':'মাস','Institutions':'প্রতিষ্ঠান','Requests':'অনুরোধ','Agreements':'সম্মতি রিপোর্ট','Settings':'সেটিংস','Create institution':'প্রতিষ্ঠান তৈরি করুন','Head secret key':'হেডের সিক্রেট কি','New key':'নতুন কি','WhatsApp number (with country code)':'হোয়াটসঅ্যাপ নাম্বার (কান্ট্রি কোডসহ)','Terms text':'নীতিমালা ও শর্তের লেখা','Add category':'ক্যাটাগরি যোগ করুন','Associates':'সহযোগী','Add associate':'সহযোগী যোগ করুন','Remove':'সরান','Loading…':'লোড হচ্ছে…','Base':'মূল','Absent days':'অনুপস্থিত দিন','Address':'ঠিকানা','Education':'শিক্ষা','Office':'অফিস'};
const t=k=>S.lang==='bn'&&BN[k]||k;

/* helpers */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x&&JSON.parse(x)}v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
let S={lang:ls('lang')||'en',theme:ls('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),sess:ls('sess'),cfg:null,tab:null,recs:[],adm:null,atab:'org',team:null,date:today(),month:today().slice(0,7),rmode:'week',msg:'',pending:null,terms:false,modal:false,newKey:'',fatal:''};

async function api(action,d={}){
  const r=await fetch(API,{method:'POST',body:JSON.stringify({action,token:S.sess&&S.sess.token,...d})});
  const j=await r.json();
  if(!j.ok){if(j.error==='Session expired'&&S.sess){logout();}throw new Error(j.error)}
  return j.data;
}
const flash=m=>{const e=document.querySelector('.err');e?e.textContent=m:alert(m)};
const by=ty=>S.recs.filter(r=>r.type===ty).map(r=>({...r.data,id:r.id}));
const upsert=(id,type,data)=>{const i=S.recs.findIndex(r=>r.id===id);i<0?S.recs.push({id,type,data}):S.recs[i].data=data};

/* views */
const bar=()=>`<div class="bar"><button class="btn s g" data-a="lang">${S.lang==='en'?'বাংলা':'English'}</button><button class="btn s g" data-a="theme">${S.theme==='dark'?'☀':'☾'}</button>${S.sess?`<button class="btn s g" data-a="logout">${t('Logout')}</button>`:''}</div>`;
const WA=`<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2zm5.3 14c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.3z"/></svg>`;

function loginView(){
  const m=S.msg;S.msg='';
  return `<div class="wrap">${bar()}<h1>${t('Office Management')}</h1>
  <form class="card" data-f="login">
  <label>${t('Secret key')}<input name="key" type="password" autocomplete="off"></label>
  <label>${t('Your name')}<input name="name"></label>
  <label>${t('Mobile')}<input name="mobile" inputmode="tel"></label>
  <label>${t('Institution name')}<input name="org"></label>
  <label>${t('Institution address')}<input name="address"></label>
  <label>${t('Category')}<select name="category">${S.cfg.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label>
  <button class="btn">${t('Continue')}</button><p class="err">${esc(m)}</p></form>
  <p class="c"><a href="#" data-a="wa">${t('Secret key not working? Contact admin')}</a></p>
  <a href="#" class="terms" data-a="terms">${t('Terms & Conditions')}</a>
  <a class="wa" data-a="wa" aria-label="WhatsApp">${WA}</a>${S.modal?termsModal():''}</div>`;
}
const termsText=()=>esc(S.cfg.terms||'—');
const termsModal=()=>`<div class="modal"><div class="card"><h2>${t('Terms & Conditions')}</h2>${termsText()}<p><button class="btn" data-a="closem">${t('Close')}</button></p></div></div>`;
const agreeView=()=>`<div class="wrap">${bar()}<h1>${t('Terms & Conditions')}</h1><div class="card" style="white-space:pre-wrap">${termsText()}</div>
  <div class="card c"><h2>${t('Do you agree?')}</h2><p class="err"></p><button class="btn" data-a="yes">${t('Yes')}</button> <button class="btn g" data-a="no">${t('No')}</button></div></div>`;

/* admin */
function adminView(){
  const A=S.adm,tabs=[['org','Institutions'],['req','Requests'],['agr','Agreements'],['set','Settings']];
  let b=`<p class="c mu">${t('Loading…')}</p>`;
  if(A){
    if(S.atab==='org')b=`<form class="card" data-f="org"><label>${t('Name')}<input name="name"></label><label>${t('Address')}<input name="address"></label>
      <label>${t('Category')}<select name="category">${A.categories.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></label><button class="btn">${t('Create institution')}</button><p class="err"></p></form>
      ${S.newKey?`<div class="card"><div class="mu">${t('Head secret key')}</div><div class="key">${esc(S.newKey)}</div></div>`:''}
      <div class="card">${A.orgs.map(o=>`<div class="row"><div><b>${esc(o.name)}</b> <span class="mu">${esc(o.category)}</span><div class="key" style="font-size:14px">${esc(o.key)}</div></div>
      <div><button class="btn s g" data-a="otog" data-id="${o.id}">${t(o.active==='yes'?'Disable':'Enable')}</button> <button class="btn s g" data-a="orekey" data-id="${o.id}">${t('New key')}</button></div></div>`).join('')||'—'}</div>`;
    if(S.atab==='req')b=`<div class="card">${A.requests.map(r=>`<div class="row"><div><b>${esc(r.name)}</b> <span class="mu">${esc(r.mobile)}</span><div class="mu">${esc(r.org)}</div></div>
      <div><button class="btn s" data-a="req" data-id="${r.id}" data-v="1">${t('Approve')}</button> <button class="btn s g" data-a="req" data-id="${r.id}" data-v="0">${t('Reject')}</button></div></div>`).join('')||'—'}</div>`;
    if(S.atab==='agr')b=`<div class="card">${A.agreements.map(g=>`<div class="row"><div><b>${esc(g.name)}</b> <span class="mu">${esc(g.mobile)}</span><div class="mu">${esc(g.org)}, ${esc(g.address)}</div><div class="mu">${esc(g.category)} · ${esc(g.level)} · ${esc(g.key)} · ${esc(g.time.replace('T',' ').slice(0,16))}</div></div></div>`).join('')||'—'}</div>`;
    if(S.atab==='set')b=`<form class="card" data-f="set" data-k="whatsapp"><label>${t('WhatsApp number (with country code)')}<input name="v" inputmode="tel" value="${esc(A.settings.whatsapp||'')}"></label><button class="btn">${t('Save')}</button></form>
      <form class="card" data-f="set" data-k="terms"><label>${t('Terms text')}<textarea name="v">${esc(A.settings.terms||'')}</textarea></label><button class="btn">${t('Save')}</button></form>
      <div class="card">${A.categories.map(c=>`<div class="row"><div><b>${esc(c.name)}</b> <span class="mu">${t(c.module==='education'?'Education':'Office')}</span></div><button class="btn s r" data-a="cdel" data-id="${esc(c.name)}">${t('Delete')}</button></div>`).join('')}
      <form data-f="cat"><label>${t('Name')}<input name="name"></label><label><select name="module"><option value="education">${t('Education')}</option><option value="office">${t('Office')}</option></select></label><button class="btn">${t('Add category')}</button><p class="err"></p></form></div>`;
  }
  return `<div class="wrap">${bar()}<h1>${t('Office Management')}</h1><div class="tabs">${tabs.map(([k,l])=>`<button class="btn s ${S.atab===k?'':'g'}" data-a="atab" data-v="${k}">${t(l)}</button>`).join('')}</div>${b}</div>`;
}

/* institution */
const F={student:['name','mobile','class'],teacher:['name','mobile','subject'],employee:['name','mobile','designation','salary']};
const LBL={name:'Name',mobile:'Mobile',class:'Class',subject:'Subject',designation:'Designation',salary:'Base salary'};
const modTabs=()=>S.sess.org.module==='education'
  ?[['student','Students'],['teacher','Teachers'],['att','Attendance'],['rep','Reports'],['note','Notifications']]
  :[['employee','Employees'],['att','Daily Attendance'],['sal','Salary'],['rep','Attendance Summary'],['note','Notifications']];
const people=()=>S.sess.org.module==='education'
  ?[...by('student').map(x=>({...x,tag:'Student'})),...by('teacher').map(x=>({...x,tag:'Teacher'}))]
  :by('employee').map(x=>({...x,tag:'Employee'}));

function orgView(){
  const tabs=[...modTabs(),...(S.sess.level==='head'?[['team','Team']]:[])];
  if(!tabs.some(x=>x[0]===S.tab))S.tab=tabs[0][0];
  const k=S.tab;
  const b=F[k]?peopleView(k):({att:attView,rep:repView,sal:salView,note:noteView,team:teamView}[k])();
  return `<div class="wrap">${bar()}<h1>${esc(S.sess.org.name)}</h1><div class="c mu">${esc(S.sess.org.category)} · ${esc(S.sess.name)}</div>
  <div class="tabs">${tabs.map(([x,l])=>`<button class="btn s ${k===x?'':'g'}" data-a="tab" data-v="${x}">${t(l)}</button>`).join('')}</div>${b}</div>`;
}
function peopleView(ty){
  return `<form class="card" data-f="person" data-t="${ty}">${F[ty].map(f=>`<label>${t(LBL[f])}<input name="${f}" ${f==='salary'?'type="number"':''}></label>`).join('')}<button class="btn">${t('Add')}</button><p class="err"></p></form>
  <div class="card">${by(ty).map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="mu">${F[ty].slice(1).map(f=>esc(p[f])).filter(Boolean).join(' · ')}</div></div><button class="btn s r" data-a="del" data-id="${p.id}">${t('Delete')}</button></div>`).join('')||'—'}</div>`;
}
function attView(){
  const m={};by('att').forEach(a=>{if(a.date===S.date)m[a.pid]=a.st});
  return `<div class="card"><label>${t('Date')}<input type="date" value="${S.date}" data-c="date"></label></div>
  <div class="card">${people().map(p=>`<div class="row"><div><b>${esc(p.name)}</b><div class="mu">${t(p.tag)}</div></div><div>${[['p','Present'],['l','Late'],['a','Absent']].map(([c,l])=>`<button class="btn s g ${c} ${m[p.id]===c?'on':''}" data-a="mark" data-id="${p.id}" data-v="${c}" title="${t(l)}">${t(l)[0]}</button>`).join(' ')}</div></div>`).join('')||'—'}</div>`;
}
function repView(){
  const edu=S.sess.org.module==='education';if(!edu)S.rmode='month';
  let f,to;
  if(S.rmode==='week'){const e=new Date();f=iso(new Date(e-6*864e5));to=iso(e)}else{f=S.month+'-01';to=S.month+'-31'}
  const att=by('att').filter(a=>a.date>=f&&a.date<=to);
  const groups=edu?[['Students','student'],['Teachers','teacher']]:[['Employees','employee']];
  return `<div class="card">${edu?`<div class="tabs"><button class="btn s ${S.rmode==='week'?'':'g'}" data-a="rmode" data-v="week">${t('Weekly')}</button><button class="btn s ${S.rmode==='month'?'':'g'}" data-a="rmode" data-v="month">${t('Monthly')}</button></div>`:''}
  ${S.rmode==='month'?`<label>${t('Month')}<input type="month" value="${S.month}" data-c="month"></label>`:`<div class="mu">${f} → ${to}</div>`}</div>`+
  groups.map(([l,ty])=>`<div class="card"><h2>${t(l)}</h2><table><tr><th>${t('Name')}</th><th>${t('Present')[0]}</th><th>${t('Late')[0]}</th><th>${t('Absent')[0]}</th></tr>${by(ty).map(p=>{const c={p:0,l:0,a:0};att.filter(a=>a.pid===p.id).forEach(a=>c[a.st]++);return `<tr><td>${esc(p.name)}</td><td>${c.p}</td><td>${c.l}</td><td>${c.a}</td></tr>`}).join('')}</table></div>`).join('');
}
function salView(){
  const rowsH=by('employee').map(e=>{
    const base=+e.salary||0,ab=by('att').filter(a=>a.pid===e.id&&a.date.startsWith(S.month)&&a.st==='a').length;
    const r=by('sal').find(s=>s.pid===e.id&&s.month===S.month),net=r?r.net:Math.round(base-ab*base/30);
    return `<div class="row"><div><b>${esc(e.name)}</b><div class="mu">${t('Base')} ${base} · ${t('Absent days')} ${ab}</div></div><div><input type="number" value="${net}" data-c="net" data-id="${e.id}" style="width:96px;display:inline-block;margin:0"> <button class="btn s ${r&&r.paid?'':'g'}" data-a="pay" data-id="${e.id}">${t('Paid')}</button></div></div>`}).join('');
  return `<div class="card"><label>${t('Month')}<input type="month" value="${S.month}" data-c="month"></label></div><div class="card">${rowsH||'—'}</div>`;
}
function noteView(){
  return `<form class="card" data-f="note"><label>${t('Title')}<input name="title"></label><label>${t('Message')}<textarea name="body" style="min-height:80px"></textarea></label><button class="btn">${t('Add')}</button><p class="err"></p></form>
  <div class="card">${by('note').sort((a,b)=>b.date.localeCompare(a.date)).map(n=>`<div class="row"><div><b>${esc(n.title)}</b><div class="mu">${esc(n.date)}</div><div>${esc(n.body)}</div></div><button class="btn s r" data-a="del" data-id="${n.id}">${t('Delete')}</button></div>`).join('')||'—'}</div>`;
}
function teamView(){
  const T=S.team;if(!T)return `<p class="c mu">${t('Loading…')}</p>`;
  return `<form class="card" data-f="member"><label>${t('Name')}<input name="name"></label><label>${t('Mobile')}<input name="mobile" inputmode="tel"></label><button class="btn">${t('Add associate')}</button><p class="err"></p></form>
  ${S.newKey?`<div class="card"><div class="mu">${t('Secret key')}</div><div class="key">${esc(S.newKey)}</div></div>`:''}
  <div class="card"><h2>${t('Associates')} (${T.members.length}/10)${T.pending?` · ${T.pending} ⏳`:''}</h2>${T.members.map(m=>`<div class="row"><div><b>${esc(m.name)}</b> <span class="mu">${esc(m.mobile)}</span><div class="key" style="font-size:14px">${esc(m.key)}</div></div><button class="btn s r" data-a="mrem" data-id="${m.id}">${t('Remove')}</button></div>`).join('')||'—'}</div>`;
}

/* render + data */
function render(){
  document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;
  let h;
  if(S.fatal)h=`<div class="wrap"><p class="err">${esc(S.fatal)}</p></div>`;
  else if(!S.cfg)h=`<div class="wrap"><p class="c mu">${t('Loading…')}</p></div>`;
  else if(!S.sess)h=S.terms?agreeView():loginView();
  else h=S.sess.role==='admin'?adminView():orgView();
  $('#app').innerHTML=h;
}
const loadAdmin=async()=>{S.adm=await api('load');render()};
const loadOrg=async()=>{S.recs=await api('all');render()};
const loadTeam=async()=>{S.team=await api('m_list');render()};
const enter=()=>{S.tab=null;S.team=null;S.sess.role==='admin'?loadAdmin():loadOrg()};
function logout(){S.sess=null;S.adm=null;S.recs=[];ls('sess',null);render()}

/* actions */
const ACT={
  lang(){S.lang=S.lang==='en'?'bn':'en';ls('lang',S.lang);render()},
  theme(){S.theme=S.theme==='dark'?'light':'dark';ls('theme',S.theme);render()},
  logout,
  wa(){const n=(S.cfg.whatsapp||'').replace(/\D/g,'');n?window.open('https://wa.me/'+n,'_blank'):flash('Admin has not set a WhatsApp number yet.')},
  terms(){S.modal=true;render()},closem(){S.modal=false;render()},
  async yes(){try{const r=await api('login',{...S.pending,agree:true});S.sess=r;ls('sess',r);S.terms=false;S.pending=null;enter()}catch(e){flash(e.message)}},
  no(){S.terms=false;S.pending=null;S.msg=S.lang==='bn'?'লগ ইন করতে নীতিমালায় একমত হতে হবে।':'You must agree to the terms to log in.';render()},
  tab(a){S.tab=a.dataset.v;render();if(S.tab==='team')loadTeam()},
  atab(a){S.atab=a.dataset.v;render()},
  rmode(a){S.rmode=a.dataset.v;render()},
  async del(a){if(!confirm(t('Delete')+'?'))return;S.recs=S.recs.filter(r=>r.id!==a.dataset.id);render();try{await api('del',{id:a.dataset.id})}catch(e){alert(e.message);loadOrg()}},
  async mark(a){const pid=a.dataset.id,id=`att_${S.date}_${pid}`,data={date:S.date,pid,st:a.dataset.v};upsert(id,'att',data);render();try{await api('save',{id,type:'att',data})}catch(e){alert(e.message)}},
  async pay(a){const pid=a.dataset.id,r=by('sal').find(s=>s.pid===pid&&s.month===S.month),inp=document.querySelector(`[data-c=net][data-id="${pid}"]`);await saveSal(pid,+inp.value,!(r&&r.paid))},
  async otog(a){try{await api('org_toggle',{id:a.dataset.id});loadAdmin()}catch(e){alert(e.message)}},
  async orekey(a){if(!confirm('?'))return;try{S.newKey=(await api('org_rekey',{id:a.dataset.id})).key;loadAdmin()}catch(e){alert(e.message)}},
  async req(a){try{await api('req',{id:a.dataset.id,ok:a.dataset.v==='1'});loadAdmin()}catch(e){alert(e.message)}},
  async cdel(a){if(!confirm('?'))return;try{await api('cat_del',{name:a.dataset.id});S.cfg=await api('config');loadAdmin()}catch(e){alert(e.message)}},
  async mrem(a){if(!confirm('?'))return;try{await api('m_remove',{id:a.dataset.id});loadTeam()}catch(e){alert(e.message)}}
};
async function saveSal(pid,net,paid){const id=`sal_${S.month}_${pid}`,data={pid,month:S.month,net,paid};upsert(id,'sal',data);render();try{await api('save',{id,type:'sal',data})}catch(e){alert(e.message)}}

const FORMS={
  login(d){if(!String(d.key).trim())throw new Error(S.lang==='bn'?'সিক্রেট কি দিন':'Enter your secret key');S.pending=d;S.terms=true;render()},
  async person(d,f){if(!String(d.name).trim())throw new Error('Name is required');const type=f.dataset.t,id=undefined;const r=await api('save',{type,data:d});upsert(r.id,type,d);render()},
  async note(d){if(!String(d.title).trim())throw new Error('Title is required');const data={...d,date:today()};const r=await api('save',{type:'note',data});upsert(r.id,'note',data);render()},
  async org(d){S.newKey=(await api('org_add',d)).key;loadAdmin()},
  async set(d,f){await api('set',{k:f.dataset.k,v:d.v});S.cfg=await api('config');await loadAdmin();flash('✓')},
  async cat(d){await api('cat_add',d);S.cfg=await api('config');loadAdmin()},
  async member(d){const r=await api('m_add',d);S.newKey=r.key||'';await loadTeam();if(r.pending)flash(S.lang==='bn'?'এডমিনের অনুমোদনের জন্য পাঠানো হয়েছে':'Sent to admin for approval')}
};

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a){e.preventDefault();ACT[a.dataset.a]&&ACT[a.dataset.a](a)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;try{await FORMS[f.dataset.f](Object.fromEntries(new FormData(f)),f)}catch(x){flash(x.message)}});
document.addEventListener('change',e=>{
  const c=e.target.dataset.c;if(!c)return;
  if(c==='date'){S.date=e.target.value||today();render()}
  if(c==='month'){S.month=e.target.value||today().slice(0,7);render()}
  if(c==='net')saveSal(e.target.dataset.id,+e.target.value,!!(by('sal').find(s=>s.pid===e.target.dataset.id&&s.month===S.month)||{}).paid);
});

/* start */
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{
  if(API.startsWith('PASTE')){S.fatal='Set the API URL at the top of index.html first.';return render()}
  try{S.cfg=await api('config');render();if(S.sess)enter()}catch(e){S.fatal='Cannot reach the server. Check your connection.';render()}
})();
</script></body></html>
